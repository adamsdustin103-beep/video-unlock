<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Access Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 400px; margin: 40px auto; background: #2d2d2d; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00d2ff; }
        .btn { display: block; width: 100%; padding: 16px; margin: 15px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .btn-unlock { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; }
        .btn-locked { background-color: #444; color: #888; cursor: not-allowed; }
        .btn-final { background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%); color: #000; display: none; }
        
        /* Full Screen Overlay */
        #adOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .timer-box { background: #333; padding: 40px; border-radius: 15px; border: 2px solid #00d2ff; }
        #countdown { font-size: 50px; color: #00d2ff; display: block; margin-top: 10px; }
    </style>
</head>
<body onbeforeunload="return checkStatus()">

<div class="container">
    <h2>ভিডিও আনলক করুন</h2>
    <p>ধাপগুলো সম্পন্ন না করলে ভিডিও আসবে না</p>

    <button id="btn1" class="btn btn-unlock" onclick="handleAd(1)">Step 1: Unlock Video</button>
    <button id="btn2" class="btn btn-locked" onclick="handleAd(2)" disabled>Step 2: Final Verification</button>
    <button id="finalBtn" class="btn btn-final" onclick="viewVideo()">🚀 Watch Full Video Now</button>
</div>

<div id="adOverlay">
    <div class="timer-box">
        <div style="font-size: 20px;">অ্যাড লোড হচ্ছে... <br>কেটে দিলে আনলক হবে না</div>
        <span id="countdown">5</span>
    </div>
</div>

<script>
    // আপনার লিংকগুলো নিচে দিন
    const adLink = "https://www.profitablecpmratenetwork.com/ycr84299d?key=1c76232d88129ecc2db73a83e4d84d04";
    const videoLink = "https://myvidplay.com/d/xu77adpjmr7h";

    let currentStep = 0;
    let isProcessing = false;

    function handleAd(step) {
        isProcessing = true;
        window.open(adLink, '_blank');
        
        const overlay = document.getElementById('adOverlay');
        const countdownDisplay = document.getElementById('countdown');
        overlay.style.display = 'flex';
        
        let timeLeft = 5;
        countdownDisplay.innerText = timeLeft;

        const timer = setInterval(function() {
            timeLeft--;
            countdownDisplay.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                overlay.style.display = 'none';
                isProcessing = false;
                completeStep(step);
            }
        }, 1000);
    }

    function completeStep(step) {
        if (step === 1) {
            const b1 = document.getElementById('btn1');
            const b2 = document.getElementById('btn2');
            b1.innerText = "✅ Step 1 Unlocked";
            b1.className = "btn btn-locked";
            b1.disabled = true;
            b2.disabled = false;
            b2.className = "btn btn-unlock";
        } else if (step === 2) {
            document.getElementById('btn2').style.display = "none";
            document.getElementById('finalBtn').style.display = "block";
        }
    }

    function viewVideo() {
        window.location.href = videoLink;
    }

    // ট্রাফিক যদি পেজ কেটে দেওয়ার চেষ্টা করে
    function checkStatus() {
        if (isProcessing) {
            return "অ্যাড চলাকালীন পেজ বন্ধ করলে আনলক হবে না!";
        }
    }
</script>

</body>
</html>
